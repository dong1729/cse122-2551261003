<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bốn mùa</title>

    <style>
      :root {
        --nen-trang: #ffffff;
        --nen-bai-tho: #fffde7;
        --nen-tieu-de: #ffd9e6;
        --mau-do: #d40000;
        --mau-xanh: #0033cc;
        --mau-vien: #9e9e9e;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        background-color: var(--nen-trang);

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Times New Roman", serif;
        font-size: 16px;
      }

      .khung-tho {
        width: 640px;
        /* Trừ phần đệm và viền để khung không tràn màn hình nhỏ. */
        max-width: calc(100% - 50px);
        padding: 24px;
        border: 1px solid var(--mau-vien);
        background-color: var(--nen-bai-tho);
        text-align: center;
      }

      h1 {
        margin: 0 0 20px;
        padding: 6px 0;
        background-color: var(--nen-tieu-de);
        color: var(--mau-do);
        font-size: 26px;
        font-weight: bold;
      }

      .kho {
        margin: 16px 0;
        font-style: italic;
        line-height: 1.7;
      }

      .xanh {
        color: var(--mau-xanh);
      }

      .do {
        color: var(--mau-do);
      }

      hr {
        width: 55%;
        margin: 18px auto;
        border: 0;
        border-top: 1px solid var(--mau-xanh);
      }
    </style>
  </head>

  <body>
    <article class="khung-tho">
      <h1>BỐN MÙA</h1>

      <p class="kho xanh">
        Xuân về hoa nở khắp trời<br />
        Hạ sang nắng cháy rạng ngời phố quen<br />
        Thu về lá rụng bên thềm
      </p>

      <hr />

      <p class="kho do">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai
      </p>

      <hr />

      <p class="kho xanh">
        Một năm rồi lại một năm<br />
        Vẫn còn câu hát thì thầm quê hương<br />
        Chờ xuân nắng mới soi đường
      </p>
    </article>
  </body>
</html>
