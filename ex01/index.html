<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bon mua</title>

    <style>
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Times New Roman", serif;
        font-size: 16px;
      }

      /* Khung bao quanh bai tho */
      .khung-tho {
        width: 640px;
        padding: 24px;
        border: 1px solid #9e9e9e;
        background-color: #fffde7;
        text-align: center;
      }

      h1 {
        margin: 0 0 20px;
        padding: 6px 0;
        font-size: 26px;
        color: #d40000;
        background-color: #ffd9e6;
      }

      /* Dinh dang chung cho ba kho tho */
      p {
        margin: 16px 0;
        color: #0033cc;
        font-style: italic;
        line-height: 1.7;
      }

      /* Kho tho thu hai co mau do */
      .do {
        color: #d40000;
      }

      hr {
        width: 55%;
        margin: 18px auto;
        border: 0;
        border-top: 1px solid #0033cc;
      }
    </style>
  </head>

  <body>
    <div class="khung-tho">
      <h1>BỐN MÙA</h1>

      <p>
        Xuân về hoa nở khắp trời<br />
        Hạ sang nắng cháy rạng ngời phố quen<br />
        Thu về lá rụng bên thềm
      </p>

      <hr />

      <p class="do">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai
      </p>

      <hr />

      <p>
        Một năm rồi lại một năm<br />
        Vẫn còn câu hát thì thầm quê hương<br />
        Chờ xuân nắng mới soi đường
      </p>
    </div>
  </body>
</html>
